};
const POSICIONES = Object.keys(POS_CFG);

const FASES = [
  { id:"grupos", label:"Fase de Grupos", short:"GRUPOS", wins:0, emoji:"🌍", color:"#444" },
  { id:"g1",     label:"Jornada 1",      short:"J1",     wins:1, emoji:"⚽", color:"#6b7280" },
  { id:"g2",     label:"Jornada 2",      short:"J2",     wins:2, emoji:"⚽", color:"#6b7280" },
  { id:"g3",     label:"Jornada 3",      short:"J3",     wins:3, emoji:"⚽", color:"#6b7280" },
  { id:"r16",    label:"16avos",         short:"16AVOS", wins:4, emoji:"⚔️", color:"#a259ff" },
  { id:"r8",     label:"Octavos",        short:"8VOS",   wins:5, emoji:"⚔️", color:"#a259ff" },

  { id:"campeon",label:"¡CAMPEÓN!",      short:"CAMPEÓN",wins:8, emoji:"🏆", color:"#ff2d55" },
];
const getFase = w => FASES.find(f => f.wins === Math.min(w, 8)) || FASES[0];

const aplicarMundialito = (jugadores, partido) => {
  if (!partido.resultado || !partido.equipos) return jugadores;
  const {golesA, golesB} = partido.resultado;
  if (golesA === golesB) return jugadores;
  const gIds = golesA > golesB ? partido.equipos.a : partido.equipos.b;
  const pIds = golesA > golesB ? partido.equipos.b : partido.equipos.a;
  const ref = {partidoId:partido.id, fecha:partido.fecha, lugar:partido.lugar};
  return jugadores.map(j => {
    if (!partido.confirmados.includes(j.id)) return j;
    const m = j.mundialito || {wins:0, campeonatos:0, historial:[]};
    if (gIds.includes(j.id)) {
      const nw = Math.min(m.wins+1, 8), ec = nw===8;
      return {...j, mundialito:{wins:ec?0:nw, campeonatos:ec?m.campeonatos+1:m.campeonatos, historial:[...(m.historial||[]),{...ref,resultado:"victoria",winsAntes:m.wins,winsDespues:ec?8:nw,campeon:ec}]}};
    }
    if (pIds.includes(j.id)) return {...j, mundialito:{wins:0, campeonatos:m.campeonatos, historial:[...(m.historial||[]),{...ref,resultado:"derrota",winsAntes:m.wins,winsDespues:0}]}};
    return j;
  });
};

// ── MUNDIALITO PATH ───────────────────────────────────────────────────────
function MundiPath({wins, compact}) {
  const fase = getFase(wins);
  const steps = FASES.slice(1);
  return (
    <div>
      <div style={{display:"flex", alignItems:"center"}}>
        {steps.map((f,i) => {
          const done=wins>=f.wins, cur=fase.id===f.id, last=i===steps.length-1;
          return (
            <div key={f.id} style={{display:"flex",alignItems:"center",flex:last?"0 0 auto":1}}>
              <div style={{
                width:cur?18:10, height:cur?18:10, borderRadius:"50%", flexShrink:0,
                background:done?f.color:C.border2,
                border:cur?`2px solid ${f.color}`:"none",
                boxShadow:cur?`0 0 10px ${f.color}88`:"none",
                display:"flex",alignItems:"center",justifyContent:"center",
                transition:"all .3s",
              }}>
                {cur && <div style={{width:6,height:6,borderRadius:"50%",background:f.color}}/>}
              </div>
              {!last && <div style={{flex:1,height:2,background:wins>f.wins?`linear-gradient(90deg,${f.color},${steps[i+1].color})`:C.border2,transition:"background .3s"}}/>}
            </div>
          );
        })}
      </div>
      {!compact && (
        <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
          <span style={{color:fase.wins===0?C.text2:fase.color,fontSize:10,fontWeight:700,fontFamily:FONT_DISPLAY,letterSpacing:1.5}}>{fase.emoji} {fase.label.toUpperCase()}</span>
          <span style={{color:C.neon,fontSize:10,fontFamily:FONT_BODY,opacity:0.8}}>{wins}/8</span>
        </div>
      )}
    </div>
  );
}

// ── MODAL RESULTADO ───────────────────────────────────────────────────────

                  <div style={{color:col.color,fontSize:9,fontWeight:700,letterSpacing:2,fontFamily:FONT_DISPLAY,marginBottom:8,textAlign:"center"}}>{col.label}</div>
                  {col.ids.map(jid=>{const j=jugadores.find(x=>x.id===jid);return j?<div key={jid} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,justifyContent:"center"}}><PlayerAvatar jugador={j} size={18}/><span style={{color:C.text2,fontSize:11,fontFamily:FONT_BODY}}>{j.nombre}</span></div>:null;})}
                </div>
          )}
        </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:12,alignItems:"center",marginBottom:20}}>
        {[{color:C.cyan,val:gA,set:setGA},{label:true},{color:C.red,val:gB,set:setGB}].map((it,i)=>
          it.label
            ? <div key={i} style={{textAlign:"center",color:C.text3,fontWeight:700,fontSize:18,fontFamily:FONT_DISPLAY}}>—</div>

                style={inp({textAlign:"center",fontSize:48,fontWeight:700,padding:"10px 0",border:`2px solid ${it.color}44`,fontFamily:FONT_DISPLAY,background:C.card2})}/>
        )}
      </div>
      {valid&&eq&&Number(gA)!==Number(gB)&&<div style={{marginBottom:16,background:`${C.red}08`,border:`1px solid ${C.red}22`,borderRadius:12,padding:"12px 14px"}}><div style={{color:C.red,fontSize:11,fontWeight:700,letterSpacing:2,fontFamily:FONT_DISPLAY,marginBottom:4}}>🌍 MUNDIALITO</div><div style={{color:C.text2,fontSize:13,fontFamily:FONT_BODY}}>{Number(gA)>Number(gB)?"✅ Equipo A avanza  ❌ Equipo B vuelve a cero":"✅ Equipo B avanza  ❌ Equipo A vuelve a cero"}</div></div>}
      {valid&&Number(gA)===Number(gB)&&<div style={{marginBottom:16,background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px"}}><div style={{color:C.text2,fontSize:13,fontFamily:FONT_BODY}}>🤝 Empate — el Mundialito no se modifica</div></div>}
      {!eq&&<div style={{marginBottom:16,background:`#ff8c0008`,border:`1px solid #ff8c0022`,borderRadius:12,padding:"12px 14px"}}><div style={{color:"#ff8c00",fontSize:12,fontFamily:FONT_BODY}}>⚠️ Armá los equipos para actualizar el Mundialito</div></div>}
      <RedBtn onClick={()=>valid&&onSave({golesA:Number(gA),golesB:Number(gB)})} disabled={!valid}>
        <Trophy size={15}/>GUARDAR RESULTADO
      </RedBtn>
    </Sheet>
  );
}

// ── ARMADOR EQUIPOS ───────────────────────────────────────────────────────
function ArmadorEquipos({confirmados, equiposIniciales, onGuardar, onClose}) {
  const init=()=>{const m={};confirmados.forEach(j=>{m[j.id]=null;});if(equiposIniciales){equiposIniciales.a.forEach(id=>{if(id in m)m[id]="a";});equiposIniciales.b.forEach(id=>{if(id in m)m[id]="b";});}return m;};
  const [asig,setAsig]=useState(init);
  const mover=(jid,eq)=>setAsig(p=>({...p,[jid]:p[jid]===eq?null:eq}));
  const eqA=confirmados.filter(j=>asig[j.id]==="a"),eqB=confirmados.filter(j=>asig[j.id]==="b"),sin=confirmados.filter(j=>asig[j.id]===null);
  const ok=sin.length===0&&eqA.length>0&&eqB.length>0;
  return (
    <Sheet title="ARMAR EQUIPOS" onClose={onClose}>
      <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:10,marginBottom:20,alignItems:"center"}}>
        <div style={{background:`${C.cyan}08`,border:`1px solid ${C.cyan}22`,borderRadius:14,padding:"14px 8px",textAlign:"center"}}><div style={{color:C.cyan,fontWeight:700,fontSize:36,fontFamily:FONT_DISPLAY,lineHeight:1}}>{eqA.length}</div><div style={{color:C.cyan,fontSize:9,fontWeight:700,letterSpacing:2,marginTop:2,fontFamily:FONT_DISPLAY}}>EQ. A</div></div>
        <div style={{textAlign:"center"}}>{sin.length>0?<div style={{color:C.text3,fontSize:11,fontFamily:FONT_BODY,lineHeight:1.4}}>{sin.length}<br/>rest.</div>:<Zap size={18} color="#22c55e"/>}</div>
        <div style={{background:`${C.red}08`,border:`1px solid ${C.red}22`,borderRadius:14,padding:"14px 8px",textAlign:"center"}}><div style={{color:C.red,fontWeight:700,fontSize:36,fontFamily:FONT_DISPLAY,lineHeight:1}}>{eqB.length}</div><div style={{color:C.red,fontSize:9,fontWeight:700,letterSpacing:2,marginTop:2,fontFamily:FONT_DISPLAY}}>EQ. B</div></div>
      </div>
      <div style={{maxHeight:360,overflowY:"auto",marginBottom:16}}>
        {[{label:"SIN ASIGNAR",list:sin,color:C.text2},{label:"EQUIPO A",list:eqA,color:C.cyan},{label:"EQUIPO B",list:eqB,color:C.red}].map(({label,list,color})=>list.length>0&&(
          <div key={label} style={{marginBottom:12}}>
            <div style={{color,fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",fontFamily:FONT_DISPLAY,marginBottom:8}}>{label} ({list.length})</div>
            {list.map(j=>{const enA=asig[j.id]==="a",enB=asig[j.id]==="b";return(
              <div key={j.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:enA?`${C.cyan}08`:enB?`${C.red}08`:C.card2,border:`1px solid ${enA?C.cyan+"33":enB?C.red+"33":C.border}`,borderRadius:14,marginBottom:8}}>
                <PlayerAvatar jugador={j} size={40}/>
                <div style={{flex:1}}><div style={{color:C.text,fontWeight:600,fontSize:15,fontFamily:FONT_BODY}}>{j.nombre}</div><Pill color={POS_CFG[j.posicion]?.color} sm>{POS_CFG[j.posicion]?.short}</Pill></div>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>mover(j.id,"a")} style={{width:36,height:36,borderRadius:10,border:`2px solid ${enA?C.cyan:C.border2}`,background:enA?`${C.cyan}22`:C.card,color:enA?C.cyan:C.text3,fontWeight:700,fontSize:14,fontFamily:FONT_DISPLAY,cursor:"pointer"}}>A</button>
                  <button onClick={()=>mover(j.id,"b")} style={{width:36,height:36,borderRadius:10,border:`2px solid ${enB?C.red:C.border2}`,background:enB?`${C.red}22`:C.card,color:enB?C.red:C.text3,fontWeight:700,fontSize:14,fontFamily:FONT_DISPLAY,cursor:"pointer"}}>B</button>
                </div>
              </div>
            );})}
          </div>
        ))}
      </div>
      <RedBtn onClick={()=>ok&&onGuardar({a:eqA.map(j=>j.id),b:eqB.map(j=>j.id)})} disabled={!ok}>
        <Shield size={15}/>CONFIRMAR EQUIPOS
      </RedBtn>
    </Sheet>
  );
}

// ── DETALLE PARTIDO ───────────────────────────────────────────────────────
function DetallePartido({partido, jugadores, onUpdate, onBack, onNuevoPartido}) {
  const [mArm,setMArm]=useState(false),[mRes,setMRes]=useState(false);
  const conf=jugadores.filter(j=>partido.confirmados.includes(j.id));
  const sups=jugadores.filter(j=>(partido.suplentes||[]).includes(j.id));
  const ocup=[...partido.confirmados,...(partido.suplentes||[])];
  const disp=jugadores.filter(j=>j.activo&&!ocup.includes(j.id));
  const lleno=conf.length>=partido.cupo, pasado=partido.fecha<todayISO(), eq=partido.equipos;
  const pct=Math.min((conf.length/partido.cupo)*100,100);
  const toggleConf=jid=>{const ya=partido.confirmados.includes(jid);onUpdate({...partido,confirmados:ya?partido.confirmados.filter(x=>x!==jid):[...partido.confirmados,jid],suplentes:(partido.suplentes||[]).filter(x=>x!==jid)});};
  const toggleSup=jid=>{const ya=(partido.suplentes||[]).includes(jid);onUpdate({...partido,confirmados:partido.confirmados.filter(x=>x!==jid),suplentes:ya?(partido.suplentes||[]).filter(x=>x!==jid):[...(partido.suplentes||[]),jid]});};
  const ascender=jid=>{if(lleno)return;onUpdate({...partido,confirmados:[...partido.confirmados,jid],suplentes:(partido.suplentes||[]).filter(x=>x!==jid)});};
  const compartir=()=>{const lines=[`⚽ *${partido.lugar.toUpperCase()} — ${fmtLarga(partido.fecha).toUpperCase()}*`,`🕐 ${partido.hora}`,``,`*TITULARES (${conf.length}/${partido.cupo}):*`,...conf.map((j,i)=>`${i+1}. ${j.nombre}  ${POS_CFG[j.posicion].emoji}`)];if(sups.length>0){lines.push(``,`*SUPLENTES:*`);sups.forEach((j,i)=>lines.push(`${i+1}. ${j.nombre}  ${POS_CFG[j.posicion].emoji}`));}lines.push(``,lleno?`✅ _Cupo completo. ¡A jugar!_`:`_Faltan ${partido.cupo-conf.length} para el cupo_`);const txt=lines.join("\n");if(navigator.share)navigator.share({text:txt});else{navigator.clipboard?.writeText(txt);alert("Lista copiada ✓");}};
  const upd=p=>onUpdate(p);

  return (
    <div style={{paddingBottom:100}}>
      {/* Hero */}
      <div style={{background:`linear-gradient(180deg,${C.red}18 0%,${C.bg} 100%)`,padding:"16px 20px 24px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-40,right:-20,width:200,height:200,borderRadius:"50%",background:`${C.red}08`,filter:"blur(30px)",pointerEvents:"none"}}/>
        <div style={{marginBottom:18}}><BackBtn onBack={onBack}/></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{color:C.red,fontSize:10,fontWeight:700,letterSpacing:3,fontFamily:FONT_DISPLAY,marginBottom:6}}>PARTIDO</div>
            <h2 style={{color:C.text,fontWeight:700,fontSize:28,margin:"0 0 10px",fontFamily:FONT_DISPLAY,textTransform:"capitalize",lineHeight:1.05,letterSpacing:1}}>{fmtLarga(partido.fecha)}</h2>
            <div style={{display:"flex",gap:16,color:C.text2,fontSize:13,fontFamily:FONT_BODY}}>
              <span style={{display:"flex",alignItems:"center",gap:5}}><Clock size={12}/>{partido.hora}</span>
              <span style={{display:"flex",alignItems:"center",gap:5}}><MapPin size={12}/>{partido.lugar}</span>
            </div>
          </div>
          <div style={{textAlign:"right",flexShrink:0,paddingLeft:16}}>
            <div style={{color:lleno?C.red:"#22c55e",fontWeight:700,fontSize:48,fontFamily:FONT_DISPLAY,lineHeight:1}}>{conf.length}<span style={{color:C.text3,fontSize:28}}>/{partido.cupo}</span></div>
            {sups.length>0&&<div style={{color:"#ffb800",fontSize:11,fontFamily:FONT_BODY}}>+{sups.length} sup</div>}
          </div>
        </div>
        {/* Avatares */}
        {conf.length>0&&<div style={{display:"flex",marginTop:14,marginBottom:14,alignItems:"center"}}>
          {jugadores.filter(j=>partido.confirmados.includes(j.id)).slice(0,7).map((j,i)=><div key={j.id} style={{marginLeft:i>0?-10:0,zIndex:10-i}}><PlayerAvatar jugador={j} size={32}/></div>)}
          {conf.length>7&&<span style={{color:C.text2,fontSize:12,marginLeft:8,fontFamily:FONT_BODY}}>+{conf.length-7}</span>}
        </div>}
        <div style={{height:2,background:C.border2,borderRadius:1}}><div style={{height:"100%",width:`${pct}%`,background:lleno?C.red:`linear-gradient(90deg,${C.red},#ff6b6b)`,borderRadius:1,transition:"width .4s",boxShadow:lleno?`0 0 8px ${C.red}`:undefined}}/></div>
      </div>

      <div style={{padding:"14px 16px 0"}}>
        {/* Resultado */}
        {pasado&&<div style={{marginBottom:14,background:C.card,border:`1px solid ${partido.resultado?C.red+"44":C.border}`,borderRadius:22,padding:20}}>
          {partido.resultado?(
            <div>
              <div style={{color:C.text2,fontSize:10,fontWeight:700,letterSpacing:3,textAlign:"center",marginBottom:16,fontFamily:FONT_DISPLAY}}>RESULTADO FINAL</div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24}}>
                <div style={{textAlign:"center"}}><div style={{color:C.cyan,fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:8,fontFamily:FONT_DISPLAY}}>EQ. A</div><div style={{color:C.cyan,fontWeight:700,fontSize:72,fontFamily:FONT_DISPLAY,lineHeight:1}}>{partido.resultado.golesA}</div></div>
                <div style={{color:C.border2,fontWeight:700,fontSize:28,fontFamily:FONT_DISPLAY}}>—</div>
                <div style={{textAlign:"center"}}><div style={{color:C.red,fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:8,fontFamily:FONT_DISPLAY}}>EQ. B</div><div style={{color:C.red,fontWeight:700,fontSize:72,fontFamily:FONT_DISPLAY,lineHeight:1}}>{partido.resultado.golesB}</div></div>
              </div>
              <button onClick={()=>setMRes(true)} style={{width:"100%",marginTop:14,background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 0",cursor:"pointer",color:C.text2,fontSize:12,fontFamily:FONT_BODY}}>Editar resultado</button>
            </div>
          ):<RedBtn onClick={()=>setMRes(true)}><Trophy size={15}/>CARGAR RESULTADO</RedBtn>}
        </div>}

        {/* Actions */}
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <GhostBtn onClick={()=>onUpdate({...partido,estado:partido.estado==="cerrado"?"abierto":"cerrado"})} color={partido.estado==="cerrado"?"#22c55e":C.text2}>
            <CheckCircle size={13}/>{partido.estado==="cerrado"?"Abierta":"Cerrar lista"}
          </GhostBtn>
          <GhostBtn onClick={()=>conf.length>=2&&setMArm(true)} color={eq?C.cyan:C.text2}>
            <ArrowRightLeft size={13}/>{eq?"Editar equipos":"Armar equipos"}
          </GhostBtn>
          <button onClick={compartir} style={{padding:"11px 14px",borderRadius:12,border:`1px solid ${C.border2}`,background:"transparent",color:"#25d366",cursor:"pointer",lineHeight:0}}><MessageCircle size={18}/></button>
          <button onClick={onNuevoPartido} style={{padding:"11px 14px",borderRadius:12,border:`1px solid ${C.red}33`,background:`${C.red}08`,color:C.red,cursor:"pointer",lineHeight:0}}><Plus size={18}/></button>
        </div>

        {/* Equipos */}
        {eq&&<div style={{marginBottom:14,background:C.card,border:`1.5px solid ${C.neon}33`,borderRadius:20,boxShadow:"0 2px 12px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.04)",overflow:"hidden"}}>
          <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:C.text,fontWeight:700,fontSize:14,fontFamily:FONT_DISPLAY,letterSpacing:2}}>🎽 EQUIPOS</span>
            <button onClick={()=>setMArm(true)} style={{background:"transparent",border:"none",color:C.text3,cursor:"pointer",fontSize:12,fontFamily:FONT_BODY,display:"flex",alignItems:"center",gap:4}}><Edit3 size={11}/>editar</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr"}}>
            {[{label:"EQ. A",color:C.cyan,ids:eq.a},{label:"EQ. B",color:C.red,ids:eq.b}].map(({label,color,ids},si)=>(
              <div key={label} style={{padding:"14px 14px",borderRight:si===0?`1px solid ${C.border}`:"none"}}>
                <div style={{color,fontWeight:700,fontSize:10,letterSpacing:2.5,marginBottom:12,fontFamily:FONT_DISPLAY}}>{label}</div>
                {ids.map(jid=>{const j=jugadores.find(x=>x.id===jid);if(!j)return null;return<div key={jid} style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><PlayerAvatar jugador={j} size={30}/><span style={{color:C.text,fontSize:13,fontFamily:FONT_BODY}}>{j.nombre}</span></div>;})}
              </div>
            ))}
          </div>
        </div>}

        {conf.length>0&&<><SecLabel>TITULARES · {conf.length}/{partido.cupo}</SecLabel>{conf.map(j=>{const fase=getFase(j.mundialito?.wins||0);return(<div key={j.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:C.card,border:`1.5px solid ${C.neon}22`,borderRadius:18,boxShadow:"0 2px 10px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.04)",marginBottom:8}}>
          <PlayerAvatar jugador={j} size={48}/>
          <div style={{flex:1}}><div style={{color:C.text,fontWeight:600,fontSize:16,fontFamily:FONT_BODY,marginBottom:4}}>{j.nombre}</div><div style={{display:"flex",alignItems:"center",gap:8}}><Pill color={POS_CFG[j.posicion]?.color} sm>{POS_CFG[j.posicion]?.emoji} {POS_CFG[j.posicion]?.short}</Pill><span style={{color:fase.color,fontSize:10,fontWeight:700,fontFamily:FONT_DISPLAY}}>{fase.emoji} {fase.short}</span></div></div>
          {partido.estado!=="cerrado"&&<div style={{display:"flex",gap:6}}>
            <button onClick={()=>toggleSup(j.id)} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:9,padding:8,cursor:"pointer",color:"#ffb800",lineHeight:0}}><UserMinus size={14}/></button>

          </div>}
        </div>);})}</>}

        {/* Suplentes */}

            {!lleno&&<button onClick={()=>ascender(j.id)} style={{padding:"7px 10px",borderRadius:9,border:"1px solid #22c55e44",background:"#00150088",color:"#22c55e",cursor:"pointer",fontWeight:600,fontSize:11,fontFamily:FONT_BODY}}>▲ TIT</button>}
            <button onClick={()=>toggleSup(j.id)} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:9,padding:8,cursor:"pointer",color:C.red,lineHeight:0}}><X size={14}/></button>
          </div>}
        </div>)}</>}

        {/* Disponibles */}
        {partido.estado!=="cerrado"&&disp.length>0&&<><SecLabel>AGREGAR</SecLabel>{disp.map(j=><div key={j.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:C.card,border:`1.5px solid ${C.neon}22`,borderRadius:18,boxShadow:"0 2px 10px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.04)",marginBottom:8}}>

// ── PANTALLA PARTIDOS ─────────────────────────────────────────────────────
function PantallaPartidos({partidos, jugadores, onUpdate, onUpdateJugadores, initDet, clearInitDet, onBack}) {
  const [modal,setModal]=useState(false), [det,setDet]=useState(initDet||null);
  useEffect(()=>{if(initDet){setDet(initDet);clearInitDet();}},[initDet]);
  const crear=p=>{onUpdate([...partidos,p]);setModal(false);};
  const upd=p=>{const ant=partidos.find(x=>x.id===p.id);if(p.resultado&&p.equipos&&(!ant?.resultado||ant.resultado.golesA!==p.resultado.golesA||ant.resultado.golesB!==p.resultado.golesB)){onUpdateJugadores(aplicarMundialito(jugadores,p));}onUpdate(partidos.map(x=>x.id===p.id?p:x));};
  const del=id=>{if(window.confirm("¿Eliminar partido?"))onUpdate(partidos.filter(x=>x.id!==id));};
  if(det){const p=partidos.find(x=>x.id===det);if(!p){setDet(null);return null;}return<DetallePartido partido={p} jugadores={jugadores} onUpdate={upd} onBack={()=>setDet(null)} onNuevoPartido={()=>{setDet(null);setModal(true);}}/>;}
  const hoy=todayISO(),prox=partidos.filter(p=>p.fecha>=hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha)),pas=partidos.filter(p=>p.fecha<hoy).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  const Card=({p})=>{
    const n=p.confirmados?.length||0,s=(p.suplentes||[]).length,pct=Math.min((n/p.cupo)*100,100),lleno=n>=p.cupo,es=p.fecha<todayISO();
    return(
      <div style={{margin:"0 16px 10px"}}>
        <button onClick={()=>setDet(p.id)} style={{width:"100%",background:C.card,border:`1.5px solid ${C.neon}33`,borderRadius:22,boxShadow:"0 2px 12px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.04)",cursor:"pointer",padding:"18px 18px 14px",textAlign:"left",display:"block",transition:"border-color .2s"}}
          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.02)"}
          onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <div style={{color:C.text,fontWeight:700,fontSize:19,fontFamily:FONT_DISPLAY,letterSpacing:1,textTransform:"capitalize",marginBottom:4}}>{fmtCorta(p.fecha)} · {p.hora}</div>
              <div style={{color:C.text2,fontSize:13,display:"flex",alignItems:"center",gap:4,fontFamily:FONT_BODY}}><MapPin size={11}/>{p.lugar}</div>
            </div>
            {es&&p.resultado?(
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{color:C.cyan,fontWeight:700,fontSize:26,fontFamily:FONT_DISPLAY}}>{p.resultado.golesA}</span>
                <span style={{color:C.text3,fontFamily:FONT_DISPLAY}}>—</span>
                <span style={{color:C.red,fontWeight:700,fontSize:26,fontFamily:FONT_DISPLAY}}>{p.resultado.golesB}</span>
              </div>
            ):(
              <div style={{textAlign:"right"}}>
                <div style={{color:lleno?C.red:"#22c55e",fontWeight:700,fontSize:26,fontFamily:FONT_DISPLAY,lineHeight:1}}>{n}<span style={{color:C.text3,fontSize:18}}>/{p.cupo}</span></div>
                {s>0&&<div style={{color:"#ffb800",fontSize:10,fontFamily:FONT_BODY}}>+{s} sup</div>}
              </div>
            )}
          </div>
          {/* Avatares apilados */}
          {n>0&&<div style={{display:"flex",marginBottom:12,alignItems:"center"}}>
            {jugadores.filter(j=>p.confirmados.includes(j.id)).slice(0,8).map((j,i)=><div key={j.id} style={{marginLeft:i>0?-8:0,zIndex:10-i}}><PlayerAvatar jugador={j} size={26}/></div>)}
            {n>8&&<div style={{width:26,height:26,borderRadius:"50%",background:C.card2,border:`1.5px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:C.text2,fontFamily:FONT_BODY,marginLeft:-8}}>+{n-8}</div>}
          </div>}
          <div style={{height:2,background:C.border2,borderRadius:1}}><div style={{height:"100%",width:`${pct}%`,background:lleno?C.red:"#22c55e",borderRadius:1}}/></div>
          <div style={{marginTop:8,display:"flex",justifyContent:"space-between"}}>
            <span style={{color:p.estado==="cerrado"?"#22c55e":C.text3,fontSize:10,fontWeight:600,letterSpacing:2,fontFamily:FONT_DISPLAY}}>{p.estado==="cerrado"?"✓ CERRADA":"ABIERTA"}</span>
            {lleno&&<span style={{background:`${C.red}18`,color:C.red,fontSize:9,fontWeight:700,borderRadius:100,padding:"2px 9px",fontFamily:FONT_DISPLAY,letterSpacing:1}}>LLENO</span>}
          </div>
        </button>
        <div style={{display:"flex",justifyContent:"flex-end",paddingRight:4}}>
          <button onClick={()=>del(p.id)} style={{padding:"5px 10px",background:"transparent",border:"none",cursor:"pointer",color:C.text3,lineHeight:0}}><Trash2 size={12}/></button>
        </div>
      </div>
    );
  };

  return(
    <div style={{paddingBottom:100}}>
      <PageHeader onBack={onBack} title="PARTIDOS" sub={`${prox.length} próximos · ${pas.length} jugados`} action={<RedBtn onClick={()=>setModal(true)} sm><Plus size={16}/>NUEVO</RedBtn>}/>

      {prox.length>0&&<><SecLabel>PRÓXIMOS</SecLabel>{prox.map(p=><Card key={p.id} p={p}/>)}</>}
      {pas.length>0&&<><SecLabel>HISTORIAL</SecLabel>{pas.map(p=><Card key={p.id} p={p}/>)}</>}
      {modal&&<ModalPartido onSave={crear} onClose={()=>setModal(false)}/>}
    </div>
  );
}

// ── PANTALLA STATS ────────────────────────────────────────────────────────
function PantallaStats({partidos, jugadores, onBack}) {
  const hoy=todayISO();
  const [showTop, setShowTop] = React.useState(false);
  React.useEffect(function() {
    var el = document.getElementById("app-scroll");
    if (!el) return;
    var handler = function() { setShowTop(el.scrollTop > 300); };
    el.addEventListener("scroll", handler);
    return function() { el.removeEventListener("scroll", handler); };
  }, []);

  var scrollToTop = function() {
    var el = document.getElementById("app-scroll");
    if (el) el.scrollTo({top:0, behavior:"smooth"});
  };

  const jug=partidos.filter(p=>p.fecha<hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Asistencia por jugador
  const asist={};
  jug.forEach(p=>p.confirmados.forEach(id=>{asist[id]=(asist[id]||0)+1;}));
  const maxAsist=Math.max(...Object.values(asist),0);

  // Goles por jugador (campo manual en jugador)
  const activos=[...jugadores.filter(j=>j.activo)];
  const rankAsist=[...activos].sort((a,b)=>(asist[b.id]||0)-(asist[a.id]||0));
  const rankGoles=[...activos].sort((a,b)=>(b.goles||0)-(a.goles||0));
  const rankLesiones=[...activos].sort((a,b)=>(b.lesiones||0)-(a.lesiones||0)).filter(j=>(j.lesiones||0)>0);
  const maxGoles=Math.max(...rankGoles.map(j=>j.goles||0),0);
  const maxLesiones=Math.max(...rankLesiones.map(j=>j.lesiones||0),0);

  return(
    <div style={{paddingBottom:100}}>
      <PageHeader onBack={onBack} title="ESTADÍSTICAS" sub="Calculado automáticamente"/>

      {/* ── GOLES ── */}
      <SecLabel>⚽ GOLES POR JUGADOR</SecLabel>
      {rankGoles.map((j,i)=>{
        const g=j.goles||0, isTop=g>0&&g===maxGoles;
        return(
          <div key={j.id} style={{margin:"0 16px 8px",display:"flex",alignItems:"center",gap:12,padding:"11px 16px",background:C.card,border:`1.5px solid ${isTop?C.neon+"66":C.neon+"22"}`,borderRadius:14,boxShadow:isTop?`0 2px 12px ${C.neon}22`:"0 2px 6px rgba(0,0,0,0.05)"}}>
            <span style={{color:C.text3,fontWeight:700,fontSize:12,fontFamily:FONT_DISPLAY,width:20,textAlign:"center"}}>{i+1}</span>
            <PlayerAvatar jugador={j} size={38}/>
            <span style={{flex:1,color:C.text,fontWeight:600,fontSize:14,fontFamily:FONT_BODY}}>{j.nombre}</span>
            {isTop&&<span style={{fontSize:14}}>🏅</span>}
            <span style={{color:isTop?C.neon:g>0?C.text:C.text3,fontWeight:700,fontSize:24,fontFamily:FONT_DISPLAY,minWidth:28,textAlign:"right",textShadow:isTop?`0 0 10px ${C.neon}`:"none"}}>{g}</span>
          </div>
        );
      })}
      {maxGoles===0&&<div style={{margin:"0 16px 8px",padding:"14px 18px",background:C.card,border:`1.5px dashed ${C.neon}33`,borderRadius:14,textAlign:"center",color:C.text3,fontSize:13,fontFamily:FONT_BODY}}>Los goles se cargan desde el perfil de cada jugador</div>}

function RankingGanadores(props) {
  var partidos = props.partidos;
  var jugadores = props.jugadores;
  var hoy = props.hoy;
  var anio = new Date().getFullYear();
  var inicio = anio + "-01-01";

  var validos = partidos.filter(function(p) {
    return p.fecha >= inicio && p.fecha < hoy &&
           p.resultado && p.equipos &&
           p.resultado.golesA !== p.resultado.golesB;
  });

  var victs = {};
  var derrs = {};
  for (var i = 0; i < validos.length; i++) {
    var p = validos[i];
    var gan = p.resultado.golesA > p.resultado.golesB ? p.equipos.a : p.equipos.b;
    var per = p.resultado.golesA > p.resultado.golesB ? p.equipos.b : p.equipos.a;
    for (var g = 0; g < gan.length; g++) { victs[gan[g]] = (victs[gan[g]]||0)+1; }
    for (var d = 0; d < per.length; d++) { derrs[per[d]] = (derrs[per[d]]||0)+1; }
  }

  var todos = jugadores
    .filter(function(j) { return j.activo; })
    .map(function(j) { return {id:j.id,nombre:j.nombre,posicion:j.posicion,foto:j.foto,avatar:j.avatar,v:victs[j.id]||0,d:derrs[j.id]||0}; })
    .sort(function(a,b) { return b.v !== a.v ? b.v - a.v : a.d - b.d; });

  var pcol = ["#FFD700","#C0C0C0","#CD7F32"];
  var orden = [1,0,2];
  var alts  = [80,110,60];
  var sizes = [52,62,46];

  return (
    <div>
      {todos[0]&&todos[0].v>0&&<div style={{margin:"0 16px 12px",background:C.card,border:"1.5px solid "+C.neon+"22",borderRadius:20,padding:"20px 12px 0"}}>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:6}}>
          {orden.map(function(pos) {
            var j = todos[pos];
            if (!j || j.v === 0) return <div key={String(pos)} style={{flex:1}}/>;
            var col = pcol[pos];
            return (
              <div key={j.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <PlayerAvatar jugador={j} size={sizes[pos]}/>
                <div style={{color:C.text,fontSize:10,fontWeight:600,fontFamily:FONT_BODY,textAlign:"center",maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{j.nombre}</div>
                <div style={{color:col,fontSize:20,fontWeight:700,fontFamily:FONT_DISPLAY,lineHeight:1,textShadow:"0 0 10px "+col+"77"}}>{j.v}</div>
                <div style={{color:C.text3,fontSize:8,fontFamily:FONT_BODY,letterSpacing:1}}>victorias</div>
                <div style={{width:"100%",height:alts[pos],background:col+"18",border:"1px solid "+col+"44",borderRadius:"8px 8px 0 0",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:8}}>
                  <span style={{color:col,fontSize:11,fontWeight:700,fontFamily:FONT_DISPLAY}}>{pos+1}.</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>}
      {todos.map(function(j,i) {
        var total = j.v + j.d;
        var pct = total > 0 ? Math.round((j.v/total)*100) : 0;
        var isTop = i===0 && j.v>0;
        var nc = i===0?"#FFD700":i===1?"#C0C0C0":i===2?"#CD7F32":C.text3;
        return (
          <div key={j.id} style={{margin:"0 16px 8px",display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:C.card,border:"1.5px solid "+(isTop?C.neon+"66":C.neon+"22"),borderRadius:16}}>
            <div style={{width:22,textAlign:"center",fontWeight:700,fontSize:13,fontFamily:FONT_DISPLAY,color:nc,flexShrink:0}}>{i+1}</div>
            <PlayerAvatar jugador={j} size={40}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:C.text,fontWeight:600,fontSize:15,fontFamily:FONT_BODY,marginBottom:5}}>{j.nombre}</div>
              <div style={{height:3,background:C.border2,borderRadius:2}}>
                <div style={{height:"100%",width:pct+"%",background:isTop?C.neon:"#22c55e",borderRadius:2}}/>
              </div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{color:isTop?C.neon:"#22c55e",fontWeight:700,fontSize:22,fontFamily:FONT_DISPLAY,lineHeight:1}}>{j.v}<span style={{color:C.text3,fontSize:11}}> V</span></div>
              <div style={{color:C.text3,fontSize:10,fontFamily:FONT_BODY,marginTop:2}}>Victorias</div>
            </div>
          </div>
        );
      })}
      <div style={{textAlign:"center",padding:"6px 0 16px"}}>
        <span style={{color:C.text3,fontSize:11,fontFamily:FONT_BODY}}>{validos.length===0?"Sin partidos jugados en "+anio:validos.length+" partidos en "+anio}</span>
      </div>
    </div>
  );
}

          <div style={{color:C.text2,fontFamily:FONT_DISPLAY,fontSize:20,fontWeight:700,marginBottom:18,letterSpacing:1}}>SIN PARTIDO PROGRAMADO</div>
          <div style={{display:"flex",justifyContent:"center"}}>
            <RedBtn onClick={()=>onNav("partidos")} sm><Plus size={14}/>CREAR PARTIDO</RedBtn>
          </div>
        </div>
      )}

      <SecLabel>EL GRUPO</SecLabel>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,padding:"0 16px"}}>
        {[{l:"Plantel",v:act.length,c:C.neon},{l:"Partidos",v:jug.length,c:C.neon},{l:"Goles",v:totalG,c:C.gold}].map(({l,v,c})=>(
          <button key={l}
            onMouseEnter={e=>e.currentTarget.style.transform="scale(1.08)"}
            onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
            style={{background:C.card,border:`1.5px solid ${C.neon}66`,borderRadius:18,padding:"18px 10px",textAlign:"center",cursor:"default",width:"100%",transition:"transform .15s ease"}}>
            <div style={{color:c,fontWeight:700,fontSize:38,fontFamily:FONT_DISPLAY,lineHeight:1}}>{v}</div>
            <div style={{color:C.text2,fontSize:9,fontWeight:600,letterSpacing:2.5,textTransform:"uppercase",marginTop:6,fontFamily:FONT_DISPLAY}}>{l}</div>
          </button>
        ))}
      </div>

      {liderM&&(liderM.mundialito?.wins||0)>0&&<>
        <SecLabel>MUNDIALITO · LÍDER</SecLabel>
        <button onClick={()=>onNav("mundialito")}
          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.03)"}
          onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
          style={{width:"calc(100% - 32px)",margin:"0 16px",background:C.card,border:`1.5px solid ${C.neon}66`,borderRadius:22,padding:"16px 18px",display:"flex",alignItems:"center",gap:14,cursor:"pointer",textAlign:"left",transition:"transform .15s ease"}}>
          <PlayerAvatar jugador={liderM} size={54}/>
          <div style={{flex:1}}>
            <div style={{color:C.text2,fontSize:9,fontWeight:700,letterSpacing:3,marginBottom:4,fontFamily:FONT_DISPLAY}}>EN CAMINO AL TÍTULO</div>
            <div style={{color:C.text,fontWeight:600,fontSize:20,fontFamily:FONT_BODY,marginBottom:10}}>{liderM.nombre}</div>
            <MundiPath wins={liderM.mundialito.wins}/>
          </div>
          <ChevronRight size={16} color={C.text3}/>
        </button>
      </>}

      <SecLabel>PRECIO</SecLabel>
      <CalculadoraCancha/>

      <SecLabel>ACCESO RÁPIDO</SecLabel>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,padding:"0 16px"}}>
        {[{l:"Plantel",i:"👥",t:"jugadores"},{l:"Mundialito",i:"🌍",t:"mundialito"},{l:"Estadísticas",i:"📊",t:"stats"},{l:"Salón de la Fama",i:"🏆",t:"salon"},{l:"Reglamento",i:"📜",t:"reglas"}].map(({l,i,t})=>(
          <button key={t} onClick={()=>onNav(t)}
            onMouseEnter={e=>e.currentTarget.style.transform="scale(1.08)"}
            onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
            style={{background:C.card,border:`1.5px solid ${C.neon}66`,borderRadius:18,padding:"18px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left",transition:"transform .15s ease"}}>
            <span style={{fontSize:24}}>{i}</span>
            <span style={{color:C.text,fontWeight:600,fontSize:14,fontFamily:FONT_BODY}}>{l}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

              {editando===j.nombre ? (
                <div style={{marginTop:8,display:"flex",gap:6,alignItems:"center"}}>
                  <input autoFocus value={textoEdit} onChange={function(e){setTextoEdit(e.target.value);}} maxLength={120} placeholder="Escribi un mensaje..." style={{flex:1,background:"rgba(0,0,0,0.4)",border:"1px solid #ffcc0066",borderRadius:8,padding:"7px 10px",color:"#fff",fontSize:12,fontFamily:FONT_BODY,outline:"none",boxSizing:"border-box"}}/>
                  <button onClick={function(){saveMensaje(j.nombre,textoEdit);}} style={{background:"#ffcc0022",border:"1px solid #ffcc0066",borderRadius:8,padding:"7px 10px",cursor:"pointer",color:"#ffcc00",fontSize:11,fontWeight:700,fontFamily:FONT_DISPLAY,flexShrink:0}}>OK</button>
                  <button onClick={function(){setEditando(null);}} style={{background:"transparent",border:"1px solid #ffffff22",borderRadius:8,padding:"7px 8px",cursor:"pointer",color:"#888",fontSize:11,fontFamily:FONT_DISPLAY,flexShrink:0}}>X</button>
                </div>
              ) : (
                <div style={{marginTop:7,display:"flex",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1,color:mensajes[j.nombre]?"rgba(255,255,255,0.75)":"rgba(255,204,0,0.25)",fontSize:12,fontFamily:FONT_BODY,fontStyle:mensajes[j.nombre]?"italic":"normal",lineHeight:1.5}}>
                    {mensajes[j.nombre] ? "“"+mensajes[j.nombre]+"”" : "Sin mensaje..."}
                  </div>
                  <button onClick={function(){setEditando(j.nombre);setTextoEdit(mensajes[j.nombre]||"");}} style={{background:"transparent",border:"1px solid #ffcc0033",borderRadius:8,padding:"5px 8px",cursor:"pointer",color:"#ffcc0077",fontSize:9,fontFamily:FONT_DISPLAY,flexShrink:0,letterSpacing:1,lineHeight:1,marginTop:2}}>EDITAR</button>
                </div>
              )}
              <div style={{display:"flex",gap:4,marginTop:8}}>
                {Array.from({length:j.mundialito.campeonatos}).map((_,ci)=>(
                  <span key={ci} style={{fontSize:16,filter:"drop-shadow(0 0 4px #ffcc00)"}}>🏆</span>
                ))}
              </div>
            </div>
          </div>
        ))}

        {/* Campeones fijos (históricos sin datos) */}
        {fijosFaltantes.map((nombre,i)=>(
          <div key={nombre} style={{background:"linear-gradient(135deg,#1a1200,#0f0c00)",border:"1.5px solid #ffcc0033",borderRadius:22,padding:"20px",display:"flex",alignItems:"center",gap:16,boxShadow:"0 4px 24px rgba(255,204,0,0.08)"}}>
            {/* Avatar placeholder con corona */}
            <div style={{width:64,height:64,borderRadius:"50%",background:"#1f1800",border:"2px solid #ffcc0055",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>👑</div>
            <div style={{flex:1}}>
              <div style={{color:"#ffcc00",fontWeight:700,fontSize:24,fontFamily:FONT_DISPLAY,letterSpacing:2,textShadow:"0 0 15px #ffcc0044"}}>{nombre.toUpperCase()}</div>
              <div style={{color:"rgba(255,204,0,0.5)",fontSize:10,fontFamily:FONT_BODY,letterSpacing:1,marginTop:3}}>CAMPEON DEL MUNDO</div>
              {editando===nombre ? (
                <div style={{marginTop:8,display:"flex",gap:6,alignItems:"center"}}>
                  <input autoFocus value={textoEdit} onChange={function(e){setTextoEdit(e.target.value);}} maxLength={120} placeholder="Escribi un mensaje..." style={{flex:1,background:"rgba(0,0,0,0.4)",border:"1px solid #ffcc0066",borderRadius:8,padding:"7px 10px",color:"#fff",fontSize:12,fontFamily:FONT_BODY,outline:"none",boxSizing:"border-box"}}/>
                  <button onClick={function(){saveMensaje(nombre,textoEdit);}} style={{background:"#ffcc0022",border:"1px solid #ffcc0066",borderRadius:8,padding:"7px 10px",cursor:"pointer",color:"#ffcc00",fontSize:11,fontWeight:700,fontFamily:FONT_DISPLAY,flexShrink:0}}>OK</button>
                  <button onClick={function(){setEditando(null);}} style={{background:"transparent",border:"1px solid #ffffff22",borderRadius:8,padding:"7px 8px",cursor:"pointer",color:"#888",fontSize:11,fontFamily:FONT_DISPLAY,flexShrink:0}}>X</button>
                </div>
              ) : (
                <div style={{marginTop:7,display:"flex",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1,color:mensajes[nombre]?"rgba(255,255,255,0.8)":"rgba(255,204,0,0.25)",fontSize:12,fontFamily:FONT_BODY,fontStyle:mensajes[nombre]?"italic":"normal",lineHeight:1.5}}>
                    {mensajes[nombre] ? "“"+mensajes[nombre]+"”" : "Sin mensaje..."}
                  </div>
                  <button onClick={function(){setEditando(nombre);setTextoEdit(mensajes[nombre]||"");}} style={{background:"transparent",border:"1px solid #ffcc0033",borderRadius:8,padding:"5px 8px",cursor:"pointer",color:"#ffcc0077",fontSize:9,fontFamily:FONT_DISPLAY,flexShrink:0,letterSpacing:1,lineHeight:1,marginTop:2}}>EDITAR</button>

const REGLAS = [
  { num:"01", emoji:"🚫", titulo:"No cobres faltas boludas", texto:"No hay nada peor que cortar el partido por caprichos. Si no sangrás, seguís jugando." },
  { num:"02", emoji:"💰", titulo:"El último junta la guita", texto:"El último en llegar a la cancha junta la guita de todos y va a pagar. Sin excepciones, sin excusas." },
  { num:"03", emoji:"🏃", titulo:"Bajarse con menos de 24hs", texto:"Si te bajas de un partido con menos de 24 horas de anticipación, no deberían considerarte persona grata en el país." },
  { num:"04", emoji:"👕", titulo:"Traé la camiseta del color", texto:"Una blanca y una negra tenés en tu casa seguro, entonces no seas tan hijo de mil puta de ir de 500 colores." },
];

function PantallaReglas({onBack}) {
  return (
    <div style={{paddingBottom:100,background:C.bg,minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:`linear-gradient(180deg,#0a0a0a 0%,${C.bg} 100%)`,padding:"18px 20px 28px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-40,left:"50%",transform:"translateX(-50%)",width:280,height:280,borderRadius:"50%",background:`radial-gradient(circle,${C.neon}12 0%,transparent 70%)`,pointerEvents:"none"}}/>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <BackBtn onBack={onBack}/>
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:10}}>📜</div>
          <h2 style={{color:C.neon,fontWeight:700,fontSize:30,fontFamily:FONT_DISPLAY,letterSpacing:4,margin:"0 0 6px",textShadow:`0 0 20px ${C.neon}66`}}>REGLAMENTO</h2>
          <p style={{color:C.text2,fontSize:12,margin:0,fontFamily:FONT_BODY,letterSpacing:2}}>OFICIAL · NO NEGOCIABLE</p>
          <div style={{width:60,height:1.5,background:`linear-gradient(90deg,transparent,${C.neon},transparent)`,margin:"14px auto 0"}}/>
        </div>
      </div>

      {/* Reglas */}
      <div style={{padding:"8px 16px 0",display:"flex",flexDirection:"column",gap:10}}>
        <style>{`.regla-card{transition:transform .15s ease;} .regla-card:active{transform:scale(1.04)!important;}`}</style>
        {REGLAS.map((r,i)=>(
          <div key={r.num} className="regla-card" style={{
            background:C.card,
            border:`1.5px solid ${C.neon}44`,
            borderRadius:20,
            padding:"18px 18px",
            display:"flex",gap:14,
            animation:`fadeIn .3s ease ${i*.07}s both`,
          }}>
            {/* Número */}
            <div style={{flexShrink:0,width:36,height:36,borderRadius:10,background:`${C.neon}15`,border:`1px solid ${C.neon}44`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{color:C.neon,fontWeight:700,fontSize:11,fontFamily:FONT_DISPLAY,letterSpacing:1}}>{r.num}</span>
            </div>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{fontSize:18}}>{r.emoji}</span>
                <span style={{color:C.text,fontWeight:700,fontSize:15,fontFamily:FONT_DISPLAY,letterSpacing:.5}}>{r.titulo}</span>
              </div>
              <p style={{color:C.text2,fontSize:13,fontFamily:FONT_BODY,lineHeight:1.6,margin:0}}>{r.texto}</p>
            </div>
          </div>
        ))}

        {/* Footer gracioso */}
        <div style={{margin:"8px 0 0",padding:"20px",textAlign:"center",border:`1px dashed ${C.neon}33`,borderRadius:16}}>
          <div style={{fontSize:24,marginBottom:8}}>⚖️</div>
          <p style={{color:C.text3,fontSize:12,fontFamily:FONT_BODY,lineHeight:1.6,margin:0}}>
            El incumplimiento de estas reglas no tiene consecuencias legales,<br/>
            pero <span style={{color:C.neon,fontWeight:600}}>sí morales</span>.
          </p>
        </div>
      </div>
    </div>
  );
}

// ── SPLASH BIENVENIDA ─────────────────────────────────────────────────────
function SplashBienvenida({onAceptar}) {
  const [saliendo, setSaliendo] = useState(false);
  const aceptar = () => {
    setSaliendo(true);
    setTimeout(onAceptar, 700);
  };
  return (
    <div style={{
      position:"fixed", inset:0, zIndex:999,
      background:"#000",
      display:"flex", alignItems:"center", justifyContent:"center",
      opacity: saliendo ? 0 : 1,
      transform: saliendo ? "scale(1.04)" : "scale(1)",
      transition: "opacity .7s ease, transform .7s ease",
    }}>
      {/* Fondo imagen */}
      <div style={{
        position:"absolute", inset:0,
        backgroundImage:`url(${fondoApp})`,
        backgroundSize:"cover", backgroundPosition:"center",
        backgroundRepeat:"no-repeat",
        opacity:0.15, pointerEvents:"none",
      }}/>
      {/* Glow de fondo */}
      <div style={{position:"absolute",top:"20%",left:"50%",transform:"translateX(-50%)",width:300,height:300,borderRadius:"50%",background:`radial-gradient(circle,${C.neon}18 0%,transparent 70%)`,pointerEvents:"none"}}/>

      <div style={{maxWidth:360,padding:"0 20px",textAlign:"center",width:"100%",position:"relative"}}>
        {/* Ícono */}
        <div style={{fontSize:64,marginBottom:24,filter:`drop-shadow(0 0 24px ${C.neon}88)`,animation:"float 3s ease-in-out infinite"}}>⚽</div>

        {/* Título */}
        <div style={{color:C.neon,fontFamily:FONT_DISPLAY,fontSize:11,fontWeight:700,letterSpacing:6,textTransform:"uppercase",marginBottom:10,textShadow:`0 0 20px ${C.neon}`}}>BIENVENIDO A</div>
        <h1 style={{color:"#fff",fontFamily:FONT_DISPLAY,fontSize:44,fontWeight:700,letterSpacing:4,margin:"0 0 32px",lineHeight:1,textTransform:"uppercase"}}>FULBITO</h1>

        {/* Divisor */}
        <div style={{width:48,height:2,background:`linear-gradient(90deg,transparent,${C.neon},transparent)`,margin:"0 auto 32px"}}/>

        {/* Mensaje */}
        <p style={{color:"rgba(255,255,255,0.75)",fontFamily:FONT_BODY,fontSize:16,lineHeight:1.7,margin:"0 0 14px"}}>
          La idea es hacernos más fácil toda la organización de los partiditos de la semana.
        </p>
        <p style={{color:"rgba(255,255,255,0.55)",fontFamily:FONT_BODY,fontSize:14,lineHeight:1.7,margin:"0 0 48px"}}>
          Espero que lo disfruten y que las estadísticas hagan que se vivan más todos los partidos. 🔥
        </p>

        {/* Botón */}
        <button onClick={aceptar} style={{
          background:`linear-gradient(135deg,${C.neon},${C.neonDim})`,
          border:"none", borderRadius:16, padding:"16px 48px",
          color:"#000", fontWeight:700, fontSize:16,
          fontFamily:FONT_DISPLAY, letterSpacing:3,
          cursor:"pointer", textTransform:"uppercase",
          boxShadow:`0 0 32px ${C.neon}66`,
          transition:"transform .15s, box-shadow .15s",
        }}
          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.05)"}
          onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
        >
          ¡ VAMOS !
        </button>
      </div>
    </div>
  );
}

function App() {
  const [grupos,setGrupos]=useState(null), [ga,setGa]=useState(null), [tab,setTab]=useState("home"), [initDet,setInitDet]=useState(null);
  const [splash,setSplash]=useState(()=>!localStorage.getItem("fulbito_bienvenida"));
  useEffect(()=>{setGrupos(DB.get("grupos")||[]);setGa(DB.get("grupoActivo")||null);},[]);
  const saveG=g=>{setGrupos(g);DB.set("grupos",g);};
  const crearGrupo=g=>{const n=[...(grupos||[]),g];saveG(n);setGa(g.id);DB.set("grupoActivo",g.id);};
  const selGrupo=id=>{setGa(id);DB.set("grupoActivo",id);setTab("home");};
  const salir=()=>{setGa(null);DB.set("grupoActivo",null);setTab("home");};
  const updGrupo=(k,v)=>{const n=grupos.map(g=>g.id===ga?{...g,[k]:v}:g);saveG(n);};
  const nav=(t,id=null)=>{setInitDet(id);setTab(t);};
  const cerrarSplash=()=>{localStorage.setItem("fulbito_bienvenida","1");setSplash(false);};

  if (grupos===null) return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:20}}>
      <div style={{fontSize:52,animation:"spin 1s linear infinite"}}>⚽</div>
      <div style={{color:C.text2,fontFamily:FONT_DISPLAY,fontSize:13,letterSpacing:5,fontWeight:700}}>CARGANDO...</div>
    </div>
  );

  if (!ga || !grupos.find(g=>g.id===ga)) return <PantallaGrupos grupos={grupos} onSelect={selGrupo} onCreate={crearGrupo}/>;

  const grupo=grupos.find(g=>g.id===ga);
  const jugadores=grupo.jugadores||[], partidos=grupo.partidos||[];
  const saveJ=j=>updGrupo("jugadores",j), saveP=p=>updGrupo("partidos",p);

  const TABS=[
    {id:"home",    Icon:Home,     label:"INICIO"},
    {id:"partidos",Icon:Calendar, label:"PARTIDOS"},
    {id:"mundialito",Icon:Globe,  label:"MUNDIAL"},
    {id:"jugadores",Icon:Users,   label:"PLANTEL"},
    {id:"stats",   Icon:BarChart2,label:"ESTAD."},
    {id:"salon",   Icon:Star,     label:"FAMA"},
    {id:"reglas",  Icon:Award,    label:"REGLAS"},
  ];

  return (
    <>
      {splash && <SplashBienvenida onAceptar={cerrarSplash}/>}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap');
        *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
        html,body{margin:0;background:#0f0f0f;}
        input,button,select{font-family:inherit;}
        input[type=date]::-webkit-calendar-picker-indicator,
        input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.3);}
        ::-webkit-scrollbar{width:0;height:0;}
        @keyframes slideUp{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes neonPulse{0%,100%{box-shadow:0 0 0 1px #00ff8733,0 0 12px #00ff8722}50%{box-shadow:0 0 0 1px #00ff8788,0 0 24px #00ff8744}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .bloque-home{transition:transform .15s ease;}
        .bloque-home:active{transform:scale(1.08)!important;}
        .bloque-home-lg{transition:transform .15s ease;}
        .bloque-home-lg:active{transform:scale(1.05)!important;}
        .regla-card{transition:transform .15s ease;}
        .regla-card:active{transform:scale(1.04)!important;}
        input::placeholder{color:${C.text3};}
        input:focus,select:focus{outline:none;border-color:#00ff8766!important;box-shadow:0 0 0 3px #00ff8722!important;}
        .neon-card{border:1.5px solid #00ff8733!important;box-shadow:0 2px 12px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.04);}
        .neon-card:hover{border-color:#00ff8777!important;box-shadow:0 4px 20px rgba(0,255,135,0.12),inset 0 1px 0 rgba(255,255,255,0.04)!important;}
      `}</style>
      <div style={{maxWidth:480,width:"100%",margin:"0 auto",height:"100dvh",background:C.bg,fontFamily:FONT_BODY,position:"relative",display:"flex",flexDirection:"column"}}>
        {/* Fondo imagen — visible en todas las pantallas excepto Salón de la Fama */}
        {tab!=="salon" && (
          <div style={{
            position:"fixed", top:0, left:"50%", transform:"translateX(-50%)",
            width:"100%", maxWidth:480, height:"100dvh",
            backgroundImage:`url(${fondoApp})`,
            backgroundSize:"cover", backgroundPosition:"center",
            backgroundRepeat:"no-repeat",
            opacity:0.15, zIndex:0, pointerEvents:"none",
          }}/>
        )}
        {/* Header */}
        <div style={{padding:"12px 16px 11px",display:"flex",alignItems:"center",gap:10,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,background:"rgba(15,15,15,0.96)",backdropFilter:"blur(20px)",zIndex:50,boxShadow:`0 1px 0 ${C.neon}33, 0 2px 16px rgba(0,0,0,0.06)`}}>
          <div style={{width:38,height:38,borderRadius:12,background:C.dark,border:`1.5px solid ${C.neon}66`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>{grupo.emoji}</div>
          <div style={{flex:1}}>
            <div style={{color:C.text,fontWeight:700,fontSize:17,fontFamily:FONT_DISPLAY,letterSpacing:2,lineHeight:1}}>{grupo.nombre.toUpperCase()}</div>
            <div style={{color:C.neon,fontSize:11,letterSpacing:3,fontFamily:FONT_DISPLAY,textShadow:`0 0 8px ${C.neon}66`}}>{grupo.dia.toUpperCase()} · FULBITO</div>
          </div>
          <button onClick={salir} style={{background:C.card2,border:`1.5px solid ${C.neon}66`,borderRadius:10,padding:"8px 12px",cursor:"pointer",color:C.neon,display:"flex",alignItems:"center",gap:5,fontFamily:FONT_DISPLAY,letterSpacing:1,fontSize:10,fontWeight:600}}>
            <LogOut size={12}/>GRUPOS
          </button>
        </div>

        {/* Content */}
        <div id="app-scroll" style={{flex:1,height:"calc(100dvh - 118px)",overflowY:"auto",overflowX:"hidden",position:"relative",zIndex:1,WebkitOverflowScrolling:"touch"}}>
          {tab==="home"       &&<PantallaHome       jugadores={jugadores} partidos={partidos} onNav={nav}/>}
          {tab==="partidos"   &&<PantallaPartidos   partidos={partidos} jugadores={jugadores} onUpdate={saveP} onUpdateJugadores={saveJ} initDet={initDet} clearInitDet={()=>setInitDet(null)} onBack={()=>nav("home")}/>}
          {tab==="mundialito" &&<PantallaMundialito jugadores={jugadores} onBack={()=>nav("home")}/>}
          {tab==="jugadores"  &&<PantallaJugadores  jugadores={jugadores} onUpdate={saveJ} onBack={()=>nav("home")}/>}
          {tab==="stats"      &&<PantallaStats      partidos={partidos} jugadores={jugadores} onBack={()=>nav("home")}/>}
          {tab==="salon"      &&<PantallaSalon      jugadores={jugadores} onBack={()=>nav("home")}/>}
          {tab==="reglas"     &&<PantallaReglas     onBack={()=>nav("home")}/>}
        </div>

        {/* Bottom nav */}
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(15,15,15,0.97)",backdropFilter:"blur(20px)",borderTop:`1.5px solid ${C.neon}55`,display:"flex",zIndex:50,paddingBottom:"max(env(safe-area-inset-bottom), 6px)",boxShadow:`0 -1px 0 ${C.border}`}}>
          {TABS.map(({id,Icon,label})=>(
            <button key={id} onClick={()=>nav(id)} style={{flex:1,padding:"12px 0 14px",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative"}}>
              <Icon size={22} color={tab===id?C.neon:"#5a665a"} strokeWidth={tab===id?2.5:1.5} style={tab===id?{filter:`drop-shadow(0 0 6px ${C.neon}cc)`}:{}}/>
              <span style={{color:tab===id?C.neon:"#6a786a",fontSize:10,fontWeight:tab===id?700:500,letterSpacing:1,fontFamily:FONT_DISPLAY,textTransform:"uppercase",textShadow:tab===id?`0 0 10px ${C.neon}88`:"none"}}>{label}</span>
              {tab===id&&<div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:28,height:3,background:C.neon,borderRadius:"2px 2px 0 0",boxShadow:`0 0 10px ${C.neon}`}}/>}
            </button>
          ))}
        </div>
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
